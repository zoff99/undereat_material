                fonts-tlwg-typewriter \
                fonts-tlwg-typist \
                fonts-tlwg-typo \
                fonts-tlwg-umpush \
                fonts-tlwg-waree \
                fonts-unfonts-core

        - name: create runscript
          run: |
               printf '#!/bin/bash\n' > /tmp/a.sh
               printf 'xclock -digital -geometry 300x45+100+688 &\n' >> /tmp/a.sh
               printf 'export LC_ALL=zh_CN.utf8\n' >> /tmp/a.sh
               printf '/home/runner/work/undereat_material/undereat_material/gradlew -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64/ run &\n' >> /tmp/a.sh
               printf 'sleep 20\n' >> /tmp/a.sh
               printf 'xwininfo -id $(xdotool getactivewindow)\n' >> /tmp/a.sh
               printf 'sleep 2\n' >> /tmp/a.sh
               printf 'sleep 20\n' >> /tmp/a.sh
               printf 'pwd\n' >> /tmp/a.sh
               printf 'sleep 5\n' >> /tmp/a.sh
               printf 'sleep 60\n' >> /tmp/a.sh
               printf 'ls -ratl\n' >> /tmp/a.sh
               printf 'sleep 4\n' >> /tmp/a.sh
               printf 'sleep 2\n' >> /tmp/a.sh
               printf 'import -window root /tmp/screenshot-linux_before_wm.png\n' >> /tmp/a.sh
               printf 'sleep 40\n' >> /tmp/a.sh
               printf 'fvwm2 &' >> /tmp/a.sh
               printf 'sleep 20\n' >> /tmp/a.sh
               printf 'xdotool mousemove --sync 1000 400 click 1\n' >> /tmp/a.sh
               printf 'sleep 90\n' >> /tmp/a.sh
               printf 'import -window root /tmp/screenshot-linux.png\n' >> /tmp/a.sh
               printf 'sleep 2\n' >> /tmp/a.sh
               printf 'xdotool mousemove --sync 200 90 click 1\n' >> /tmp/a.sh
               printf 'sleep 1\n' >> /tmp/a.sh
               printf 'xdotool mousemove --sync 1000 400 click 1\n' >> /tmp/a.sh
               printf 'sleep 1\n' >> /tmp/a.sh
               printf 'import -window root /tmp/screenshot-linux_02.png\n' >> /tmp/a.sh
               cat /tmp/a.sh
               chmod a+rx /tmp/a.sh

        - name: generate locale
          run: |
               cat /etc/locale.gen
               cat /etc/locale.gen|grep -i zn||echo "NO ERR"
               echo "zh_CN.UTF-8 UTF-8" |sudo tee -a /etc/locale.gen
               sudo locale-gen

        - name: generate locale
          run: |
               sudo localectl set-locale LANG="zh_CN.UTF-8"
               export LANG="zh_CN.UTF-8"
               sudo update-locale
               locale -a
               locale
               locale -c -k LC_NUMERIC
               sudo update-locale LANG="zh_CN.UTF-8"
               localectl status

        - name: startup-app
          run: |
               pwd
               ls -al
               export LC_ALL=zh_CN.utf8
               sed -i -e 's#DEMO_SHOWCASE_DEBUG_ONLY = false#DEMO_SHOWCASE_DEBUG_ONLY = true#' ./src/main/java/com/zoffcc/applications/undereat/corefuncs.java
               ./gradlew -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64/ assemble
               xvfb-run --server-args="-screen 0 1024x768x24" --auto-servernum /tmp/a.sh
               echo "++++++++++++++++++"
               echo "++++++++++++++++++"
               cat /home/runner/work/undereat_material/undereat_material/undereat.log||echo "NO ERR"
               echo "++++++++++++++++++"
               echo "++++++++++++++++++"
               cp -av /tmp/screenshot-linux.png screenshot-linux.png
               cp -av /tmp/screenshot-linux_02.png screenshot-linux_02.png

        - name: upload-screenshots
          uses: actions/upload-artifact@v7
          with:
            name: screenshot-linux
            path: /tmp/screenshot-linux.png

        - name: upload-screenshots_02
          uses: actions/upload-artifact@v7
          with:
            name: screenshot-linux_02
            path: /tmp/screenshot-linux_02.png

        - name: upload-screenshots
          uses: actions/upload-artifact@v7
          with:
            name: screenshot-linux_before_wm
            path: /tmp/screenshot-linux_before_wm.png

        - name: Upload to nightly release
          uses: ncipollo/release-action@v1
          if: github.ref == 'refs/heads/master'
          with:
            allowUpdates: true
            tag: nightly
            omitBodyDuringUpdate: true
            omitNameDuringUpdate: true
            prerelease: true
            replacesArtifacts: true
            token: ${{ secrets.GITHUB_TOKEN }}
            artifacts: "screenshot-linux.png,screenshot-linux_02.png"



